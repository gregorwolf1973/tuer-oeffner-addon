<!doctype html>
<html lang="de" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Türöffner – Verwaltung</title>
  <link rel="icon" href="static/icon-192.png">
  <link rel="stylesheet" href="static/style.css">
  <link rel="stylesheet" href="static/admin.css">
</head>
<body>
  <main class="breit">
    <header class="kopf">
      <img src="static/icon-192.png" alt="" class="logo">
      <h1>Türöffner – Verwaltung</h1>
      <button type="button" class="knopf rechts" id="test-oeffnen">Tür jetzt öffnen</button>
    </header>

    <p id="meldung" class="meldung" role="status" hidden></p>
    <div id="warnungen"></div>

    <section id="ww-verwaltung" class="karte ww-verwaltung" aria-labelledby="ww-v-titel" hidden>
      <div class="karte-kopf">
        <h2 id="ww-v-titel">Warmwasser</h2>
        <span id="ww-v-temperatur" class="ww-temperatur">–</span>
      </div>
      <p id="ww-v-status" class="leise ww-status"></p>
      <form id="ww-ziel-form" class="ww-ziel">
        <span class="leise">Zieltemperatur beim Aufheizen</span>
        <div class="ww-ziel-regler">
          <button type="button" class="knopf" data-schritt="-1" aria-label="Kälter">−</button>
          <output id="ww-ziel-anzeige" aria-live="polite">–</output>
          <button type="button" class="knopf" data-schritt="1" aria-label="Wärmer">+</button>
        </div>
        <button class="knopf haupt" id="ww-ziel-speichern" disabled>Übernehmen</button>
        <p class="leise">Die Wärmepumpe wird erst darauf gestellt, wenn jemand in der App „Wasser aufheizen“ drückt.</p>
      </form>
    </section>

    <div class="abschnitt-kopf">
      <h2>Zugänge</h2>
      <span id="zaehler" class="leise"></span>
    </div>
    <div id="benutzer" class="zugaenge"></div>

    <h2>Protokoll</h2>
    <div class="tabelle-rahmen">
      <table>
        <thead><tr><th>Zeit</th><th>Wer</th><th>Was</th><th>Detail</th><th>Absender</th></tr></thead>
        <tbody id="protokoll"></tbody>
      </table>
    </div>

    <details class="einstellungen-block">
      <summary><h2>Einstellungen</h2></summary>
      <dl id="einstellungen" class="einstellungen-liste"></dl>
      <p class="leise">Geändert werden die Einstellungen in den Optionen des Add-ons.</p>
    </details>
  </main>
  <script src="static/admin.js"></script>
</body>
</html>
